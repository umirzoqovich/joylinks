<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="joyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="30" y="30" width="440" height="440" rx="100" fill="url(#joyGrad)" filter="url(#shadow)"/>

  <!-- Inner border glow -->
  <rect x="35" y="35" width="430" height="430" rx="95" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Joylinks Icon: Graduation cap + dynamic connections -->
  <g transform="translate(100, 110)">
    <!-- Graduation Cap Top -->
    <polygon points="150,40 270,105 150,170 30,105" fill="#ffffff" />
    
    <!-- Cap Base -->
    <path d="M70,135 L70,185 C70,230 230,230 230,185 L230,135 C205,155 175,165 150,165 C125,165 95,155 70,135 Z" fill="#e0e7ff" />
    
    <!-- Tassel -->
    <path d="M250,115 L255,190" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="255" cy="205" r="14" fill="#f59e0b" />

    <!-- Connecting link dots (Joylinks) -->
    <g transform="translate(0, 150)">
      <circle cx="70" cy="90" r="16" fill="#38bdf8" />
      <circle cx="150" cy="90" r="22" fill="#fbbf24" />
      <circle cx="230" cy="90" r="16" fill="#34d399" />
      <line x1="70" y1="90" x2="230" y2="90" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" />
    </g>
  </g>
</svg>
